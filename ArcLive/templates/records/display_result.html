{% extends "base/base.html" %}
{% block main %}

<canvas id="result_canvas" width="800" height="1200" style="width:100%; max-width:400px; border:1px solid #ccc;"></canvas>

<div class="flex-box4">
    <button type="button" id="download_btn" class="btn btn-success w-100">画像をダウンロード</button>
</div>

<script>
const canvas = document.getElementById('result_canvas');
const ctx = canvas.getContext('2d');

const backgroundUrl = "{{ background_url }}";
const textColor = "{{ color }}";
const fontFamily = "{{ font }}";

// --- ① レコードのデータをDjangoから受け取る ---
const recordsData = [
    {% for record in record_list %}
    {
        date: "{{ record.live_date|date:'Y/m/d' }}",
        event: "{{ record.event_name|escapejs }}",
        artists: "{% for ar in record.artist_records.all %}{{ ar.artist_id.name|escapejs }}{% if not forloop.last %}, {% endif %}{% endfor %}"
    },
    {% endfor %}
];

// --- ② 1レコード = 1セット(日付・アーティスト・イベント名)として扱う ---
// x, y は「このセット全体」の基準点(左上)
// gap は、日付→アーティスト→イベント名の間の余白
const fontSize = 20;
const gap = 20;

let recordItems = [];
let startY = 40;
recordsData.forEach(function(record) {
    recordItems.push({
        x: 40,
        y: startY,
        date: record.date,
        artist: record.artists,
        event: record.event
    });
    startY += fontSize + 20; // 次のレコードとの縦の間隔
});

// --- ③ 背景画像は一度だけ読み込んで覚えておく ---
let bgImage = null;

function loadBackground() {
    if (!backgroundUrl) {
        redrawAll();
        return;
    }
    bgImage = new Image();
    bgImage.crossOrigin = "anonymous";
    bgImage.onload = function() { redrawAll(); };
    bgImage.onerror = function() { bgImage = null; redrawAll(); };
    bgImage.src = backgroundUrl;
}

// --- ④ 1セット分の「横幅」を計算する(日付+アーティスト+イベント名+すきま) ---
function measureRecordWidth(item) {
    ctx.font = `bold ${fontSize}px ${fontFamily}`;
    const dateWidth = ctx.measureText(item.date).width;
    ctx.font = `${fontSize}px ${fontFamily}`;
    const artistWidth = ctx.measureText(item.artist).width;
    const eventWidth = ctx.measureText(item.event).width;

    return dateWidth + gap + artistWidth + gap + eventWidth;
}

// --- ⑤ 背景 + 全レコードを描き直す ---
function redrawAll() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (bgImage) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    ctx.fillStyle = textColor;
    ctx.textBaseline = "top";

    recordItems.forEach(function(item) {
        let cursorX = item.x;

        // 日付(太字)
        ctx.font = `bold ${fontSize}px ${fontFamily}`;
        ctx.fillText(item.date, cursorX, item.y);
        cursorX += ctx.measureText(item.date).width + gap;

        // アーティスト名
        ctx.font = `${fontSize}px ${fontFamily}`;
        ctx.fillText(item.artist, cursorX, item.y);
        cursorX += ctx.measureText(item.artist).width + gap;

        // イベント名
        ctx.fillText(item.event, cursorX, item.y);
    });
}

// --- ⑥ 指で触れた場所が、どのレコード(セット全体)の上かを判定する ---
function getRecordAt(x, y) {
    for (let i = recordItems.length - 1; i >= 0; i--) {
        const item = recordItems[i];
        const width = measureRecordWidth(item);
        const height = fontSize * 1.3;

        if (x >= item.x && x <= item.x + width &&
            y >= item.y && y <= item.y + height) {
            return item;
        }
    }
    return null;
}

// --- ⑦ 画面の座標をCanvas内部の座標に変換する ---
function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    let clientX, clientY;
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }

    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

// --- ⑧ ドラッグの状態 ---
let draggingItem = null;
let dragOffsetX = 0;
let dragOffsetY = 0;

function handleStart(e) {
    const pos = getCanvasPos(e);
    const item = getRecordAt(pos.x, pos.y);
    if (item) {
        draggingItem = item;
        dragOffsetX = pos.x - item.x;
        dragOffsetY = pos.y - item.y;
        e.preventDefault();
    }
}

function handleMove(e) {
    if (!draggingItem) return;
    const pos = getCanvasPos(e);
    // ★ここがポイント:x, y(基準点)だけを動かす → 3つの文字が一緒についてくる
    draggingItem.x = pos.x - dragOffsetX;
    draggingItem.y = pos.y - dragOffsetY;
    redrawAll();
    e.preventDefault();
}

function handleEnd(e) {
    draggingItem = null;
}

canvas.addEventListener('touchstart', handleStart, { passive: false });
canvas.addEventListener('touchmove', handleMove, { passive: false });
canvas.addEventListener('touchend', handleEnd);

canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('mousemove', handleMove);
canvas.addEventListener('mouseup', handleEnd);

loadBackground();

document.getElementById('download_btn').addEventListener('click', function() {
    const link = document.createElement('a');
    link.download = 'my_record.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
});
</script>

{% endblock %}
