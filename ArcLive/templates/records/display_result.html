{% extends "base/base.html" %}
{% block main %}

<canvas id="result_canvas" width="800" height="1200" style="width:100%; max-width:400px; border:1px solid #ccc;"></canvas>
<div class="flex-box4" style="margin-top:10px;">
    <button type="button" id="zoom_out_btn" class="btn btn-outline-dark">－</button>
    <button type="button" id="zoom_in_btn" class="btn btn-outline-dark">＋</button>
</div>

<div class="flex-box4">
    <button type="button" id="download_btn" class="btn btn-success w-100">画像をダウンロード</button>
</div>

<script>
const canvas = document.getElementById('result_canvas');
const ctx = canvas.getContext('2d');

const backgroundUrl = "{{ background_url }}";
const textColor = "{{ color }}";
const fontFamily = "{{ font }}";

const recordsData = [
    {% for record in record_list %}
    {
        date: "{{ record.live_date|date:'Y/m/d' }}",
        event: "{{ record.event_name|escapejs }}",
        artists: "{% for ar in record.artist_records.all %}{{ ar.artist_id.name|escapejs }}{% if not forloop.last %}, {% endif %}{% endfor %}"
    },
    {% endfor %}
];

// --- 基準となるフォントサイズ・間隔(拡大率1.0のときの値) ---
const baseFontSize = 20;
const baseGap = 20;

let recordItems = [];
let startY = 40;
recordsData.forEach(function(record) {
    recordItems.push({
        baseX: 40,
        baseY: startY,
        date: record.date,
        artist: record.artists,
        event: record.event
    });
    startY += baseFontSize + 20;
});

// --- 全体の移動量・拡大率 ---
let groupOffsetX = 0;
let groupOffsetY = 0;
let groupScale = 1.0;   // ★追加:1.0が基準サイズ
const MIN_SCALE = 0.3;
const MAX_SCALE = 3.0;

let bgImage = null;

function loadBackground() {
    if (!backgroundUrl) {
        redrawAll();
        return;
    }
    bgImage = new Image();
    bgImage.crossOrigin = "anonymous";
    bgImage.onload = function() { redrawAll(); };
    bgImage.onerror = function() { bgImage = null; redrawAll(); };
    bgImage.src = backgroundUrl;
}

// --- 現在の拡大率を反映したフォントサイズ・間隔を計算 ---
function currentFontSize() {
    return baseFontSize * groupScale;
}
function currentGap() {
    return baseGap * groupScale;
}

function measureRecordWidth(item) {
    const fontSize = currentFontSize();
    const gap = currentGap();
    ctx.font = `bold ${fontSize}px ${fontFamily}`;
    const dateWidth = ctx.measureText(item.date).width;
    ctx.font = `${fontSize}px ${fontFamily}`;
    const artistWidth = ctx.measureText(item.artist).width;
    const eventWidth = ctx.measureText(item.event).width;
    return dateWidth + gap + artistWidth + gap + eventWidth;
}

function redrawAll() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (bgImage) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    ctx.fillStyle = textColor;
    ctx.textBaseline = "top";

    const fontSize = currentFontSize();
    const gap = currentGap();

    recordItems.forEach(function(item) {
        // ★位置も拡大率に応じて中心から広がるように調整
        const x = item.baseX * groupScale + groupOffsetX;
        const y = item.baseY * groupScale + groupOffsetY;
        let cursorX = x;

        ctx.font = `bold ${fontSize}px ${fontFamily}`;
        ctx.fillText(item.date, cursorX, y);
        cursorX += ctx.measureText(item.date).width + gap;

        ctx.font = `${fontSize}px ${fontFamily}`;
        ctx.fillText(item.artist, cursorX, y);
        cursorX += ctx.measureText(item.artist).width + gap;

        ctx.fillText(item.event, cursorX, y);
    });
}

function isInsideAnyRecord(x, y) {
    for (let i = 0; i < recordItems.length; i++) {
        const item = recordItems[i];
        const itemX = item.baseX * groupScale + groupOffsetX;
        const itemY = item.baseY * groupScale + groupOffsetY;
        const width = measureRecordWidth(item);
        const height = currentFontSize() * 1.3;

        if (x >= itemX && x <= itemX + width &&
            y >= itemY && y <= itemY + height) {
            return true;
        }
    }
    return false;
}

function getCanvasPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

// --- 移動(ドラッグ)の状態 ---
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;
let offsetStartX = 0;
let offsetStartY = 0;

// --- ピンチ(2本指拡大縮小)の状態 ---
let isPinching = false;
let pinchStartDist = 0;
let pinchStartScale = 1.0;

function getTouchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
}

// --- タッチ操作(スマホ・タブレット) ---
function handleTouchStart(e) {
    if (e.touches.length === 2) {
        // 2本指 → ピンチ拡大縮小の開始
        isDragging = false;
        isPinching = true;
        pinchStartDist = getTouchDistance(e.touches);
        pinchStartScale = groupScale;
        e.preventDefault();
    } else if (e.touches.length === 1) {
        const pos = getCanvasPos(e.touches[0].clientX, e.touches[0].clientY);
        if (isInsideAnyRecord(pos.x, pos.y)) {
            isDragging = true;
            dragStartX = pos.x;
            dragStartY = pos.y;
            offsetStartX = groupOffsetX;
            offsetStartY = groupOffsetY;
            e.preventDefault();
        }
    }
}

function handleTouchMove(e) {
    if (isPinching && e.touches.length === 2) {
        const newDist = getTouchDistance(e.touches);
        const ratio = newDist / pinchStartDist;
        groupScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, pinchStartScale * ratio));
        redrawAll();
        e.preventDefault();
    } else if (isDragging && e.touches.length === 1) {
        const pos = getCanvasPos(e.touches[0].clientX, e.touches[0].clientY);
        groupOffsetX = offsetStartX + (pos.x - dragStartX);
        groupOffsetY = offsetStartY + (pos.y - dragStartY);
        redrawAll();
        e.preventDefault();
    }
}

function handleTouchEnd(e) {
    isDragging = false;
    isPinching = false;
}

// --- マウス操作(パソコン) ---
function handleMouseDown(e) {
    const pos = getCanvasPos(e.clientX, e.clientY);
    if (isInsideAnyRecord(pos.x, pos.y)) {
        isDragging = true;
        dragStartX = pos.x;
        dragStartY = pos.y;
        offsetStartX = groupOffsetX;
        offsetStartY = groupOffsetY;
    }
}

function handleMouseMove(e) {
    if (!isDragging) return;
    const pos = getCanvasPos(e.clientX, e.clientY);
    groupOffsetX = offsetStartX + (pos.x - dragStartX);
    groupOffsetY = offsetStartY + (pos.y - dragStartY);
    redrawAll();
}

function handleMouseUp(e) {
    isDragging = false;
}

// --- マウスホイールでも拡大縮小できるように ---
function handleWheel(e) {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.1 : -0.1;
    groupScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, groupScale + delta));
    redrawAll();
}

canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
canvas.addEventListener('touchend', handleTouchEnd);

canvas.addEventListener('mousedown', handleMouseDown);
canvas.addEventListener('mousemove', handleMouseMove);
canvas.addEventListener('mouseup', handleMouseUp);
canvas.addEventListener('wheel', handleWheel, { passive: false });

// --- ＋/－ボタンでの拡大縮小 ---
document.getElementById('zoom_in_btn').addEventListener('click', function() {
    groupScale = Math.min(MAX_SCALE, groupScale + 0.1);
    redrawAll();
});
document.getElementById('zoom_out_btn').addEventListener('click', function() {
    groupScale = Math.max(MIN_SCALE, groupScale - 0.1);
    redrawAll();
});

loadBackground();

document.getElementById('download_btn').addEventListener('click', function() {
    const link = document.createElement('a');
    link.download = 'my_record.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
});
</script>

{% endblock %}
