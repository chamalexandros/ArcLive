<!-- 日付選択モーダル(ホイール式) -->
<div class="modal fade" id="DatePickerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-date-content">
            <div class="modal-header">
                <h5 class="modal-date-title">日付を選択</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="wheel-picker">
                    <div class="wheel-column" id="wheel-year"></div>
                    <div class="wheel-column" id="wheel-month"></div>
                    <div class="wheel-column" id="wheel-day"></div>
                    <div class="wheel-highlight"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary w-100" id="confirmDateBtn">決定</button>
            </div>
        </div>
    </div>
</div>
