{% extends "base/arclive_base.html" %}
{% load static %}
{% block extra_css %}
  <link rel="stylesheet" href="/static/css/ps_reset_confirm.css">
{% endblock%}
{% block body %}
<div class="confirm-flex">
    <form action="" method="POST" class="confirm-form">
        {{ form.non_field_errors }}
        {% for field in form %}

        <div class="ps_reset_confirm">
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
        </div>
        {% endfor %}
        {% csrf_token %}
        <div class="flex-box">
            <button type="submit" class="send">送信</button>
        </div>
    </form>
</div>
{% endblock %}
