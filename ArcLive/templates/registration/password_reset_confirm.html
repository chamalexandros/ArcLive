{% extends "base/arclive_base.html" %}
{% load static %}
{% block extra_css %}
  <link rel="stylesheet" href="/static/css/ps_reset_confirm.css">
{% endblock%}
{% block body %}
<form action="" method="POST">
    {{ form.non_field_errors }}
    {% for field in form %}
    <div class="ps_reset_confirm">
        <label for="{{ field.id_for_label }}">{{ field.label_tag }}</label>
        {{ field }}
        {{ field.errors }}
    </div>
    {% endfor %}
    {% csrf_token %}
    <div class="flex-box">
        <button type="submit" class="send">送信</button>
    </div>
</form>
{% endblock %}
