{% extends "base/arclive_base.html" %}
{% load static %}
{% block extra_css %}
    <link rel="stylesheet" href="/static/css/signup.css">
{% endblock %}
{% block body %}
<div class="flex-box">
    <h4>新規アカウント登録<h4>

    <form method="post" style="display: inline-block; text-align: left;  margin-top:5px; padding 30px; border-radius: 10px">
        {% csrf_token %}
        <div class="signup">
            {{ form.as_p }}
        </div>
        <div class="flex-box">
            <button type="submit" id="registration">登録</button>
        </div>
    </form>
    <div>
        <a href="{% url 'login' %}" style="font-size:14px" class="return">ログイン画面に戻る</a>
    </div>
</div>
{% endblock %}
