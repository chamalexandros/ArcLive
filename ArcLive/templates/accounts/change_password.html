{% extends "base/base.html" %}
{% load static %}
{% block extra_css %}
    <link rel="stylesheet" href="/static/css/change_ps.css">
{% endblock %}
{% block main %}
<div class=flex-box1>
    <div class="flex-mypage">
        <h4>パスワード変更<h4>
        <form method="post">
            {% csrf_token %}
            
            <div style="text-align: left; display:inline-block; margin-bottom: 10px ;">
                <h6>{{ form.as_p }}<h6>
            </div>
        </form>
    </div>
    <div class="flex-box">
            <button type="submit" id="change-ps" class="change"><a href="{% url 'accounts:mypage' %}" class="button-style" role="button">変更</a></button>
    </div>
</div>
{% endblock %}
